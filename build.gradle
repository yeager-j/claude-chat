import groovy.json.JsonSlurper

import java.util.zip.ZipFile

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

configurations {
	vineflower {
		transitive = false
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"claudechat" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Client game tests (src/gametest): ./gradlew runClientGameTest starts the game, plays through the mod and saves
// screenshots to build/run/clientGameTest/screenshots. Must come after splitEnvironmentSourceSets().
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "claudechat-test"
		enableGameTests = false
		enableClientGameTests = true
	}
}

/**
 * Passes the mods in an -PextraMods folder to Fabric Loader as {@code -Dfabric.addMods}. Read when the task
 * runs, so a changed folder is never served from the configuration cache.
 */
class ExtraModsArguments implements CommandLineArgumentProvider {
	/** Mods the dev run already has: this mod (an installed release would replace the code under test) and Fabric API. */
	private static final Set<String> PROVIDED_MOD_IDS = ["claudechat", "fabric-api"] as Set

	private final String folderPath

	ExtraModsArguments(String folderPath) {
		this.folderPath = folderPath
	}

	@Input
	String getFolderPath() {
		return folderPath
	}

	@Override
	Iterable<String> asArguments() {
		File folder = new File(folderPath)
		if (!folder.isDirectory()) {
			throw new GradleException("-PextraMods must be a folder of mod jars, but '${folderPath}' is not a directory.")
		}

		List<File> jars = folder.listFiles({ File file -> file.name.endsWith(".jar") } as FileFilter).sort()
		List<File> extraJars = jars.findAll { !PROVIDED_MOD_IDS.contains(modId(it)) }
		if (extraJars.isEmpty()) return []

		return ["-Dfabric.addMods=" + extraJars.join(File.pathSeparator)]
	}

	/** The id in the jar's fabric.mod.json, or null when it has none (a plain library). */
	private static String modId(File jar) {
		return new ZipFile(jar).withCloseable { zip ->
			def entry = zip.getEntry("fabric.mod.json")
			if (entry == null) return null

			return zip.getInputStream(entry).withCloseable { stream ->
				new JsonSlurper().parse(stream).id
			}
		}
	}
}

// Test against real mods: ./gradlew runClientGameTest -PextraMods=<folder of mod jars>
// (the run's own mods/ folder is cleared each time, so the jars are passed to Fabric Loader instead).
tasks.named("runClientGameTest") {
	def extraMods = providers.gradleProperty("extraMods")
	if (extraMods.isPresent()) {
		jvmArgumentProviders.add(new ExtraModsArguments(extraMods.get()))
	}
}

// Fast unit tests (src/test): ./gradlew test. They see the client code, and fabric-loader-junit loads
// Minecraft classes the way the game does, without starting a client.
sourceSets {
	test {
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

test {
	useJUnitPlatform()

	// Fabric Loader writes logs/ into the working directory; keep it out of the project root.
	def testRunDir = layout.buildDirectory.dir("unitTest").get().asFile
	workingDir testRunDir
	doFirst { testRunDir.mkdirs() }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API is a hard dependency (client commands, game tests), and fabric.mod.json requires it too.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	vineflower "org.vineflower:vineflower:${project.vineflower_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// The mod metadata and mixin config take their versions from gradle.properties.
def metadataProperties = [
	version           : project.version.toString(),
	java_version      : project.java_version,
	minecraft_version : project.minecraft_version,
	loader_version    : project.loader_version,
	fabric_api_version: project.fabric_api_version,
]

tasks.named("processResources") {
	inputs.properties metadataProperties

	filesMatching("fabric.mod.json") {
		expand metadataProperties
	}

	// Ship the decompiler as a plain resource; the mod runs it as a separate Java process
	// so decompiling never shares memory with the game.
	from(configurations.vineflower) {
		into "claudechat"
		rename { "vineflower.jar" }
	}
}

tasks.named("processClientResources") {
	inputs.properties metadataProperties

	filesMatching("*.mixins.json") {
		expand metadataProperties
	}
}

java {
	// Gradle finds a matching JDK itself (the JVM running Gradle counts), so no per-machine path is checked in.
	toolchain {
		languageVersion = JavaLanguageVersion.of(project.java_version as int)
	}

	// Attaches a sources jar to the "build" task. Minecraft 26.x is unobfuscated, so Loom has nothing to remap.
	withSourcesJar()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
